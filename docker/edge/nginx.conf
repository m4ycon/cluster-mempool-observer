resolver 127.0.0.11 valid=10s ipv6=off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

include /etc/nginx/cloudflare-ips.conf;

limit_req_zone $binary_remote_addr zone=api_req:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=grafana_req:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=ws_req:10m rate=12r/m;
limit_req_status 429;

limit_conn_zone $binary_remote_addr zone=ws_conn:10m;
limit_conn_status 429;

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ${PUBLIC_DOMAIN};

    ssl_certificate /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location /api/ {
        limit_req zone=api_req burst=20 nodelay;
        set $api_upstream http://api:3333;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
    }

    location = /ws {
        limit_req zone=ws_req burst=5 nodelay;
        limit_conn ws_conn 8;
        set $ws_upstream http://api:3333;
        proxy_pass $ws_upstream/ws;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location /grafana {
        limit_req zone=grafana_req burst=60 nodelay;
        set $grafana_upstream http://grafana:3000;
        proxy_pass $grafana_upstream;
    }

    location / {
        set $web_upstream http://web:80;
        proxy_pass $web_upstream;
    }
}
