server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Filenames are content-hashed, so they can never go stale.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # The entry point must be revalidated or new deploys are never picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: /clusters, /fees and friends are not real files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
