[package]
name = "observer"
version.workspace = true
edition.workspace = true

[dependencies]
async-nats.workspace = true
corepc-client.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Spawns a regtest bitcoind for integration tests
corepc-node = { version = "0.12.0", default-features = false, features = ["30_2", "download"] }

[features]
# Treat warnings as a build error. Enabled in CI; off for local dev.
strict = []
node_integration_tests = []
nats_integration_tests = []
