[workspace]
resolver = "3"
members = ["observer"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
async-nats = "0.49"
corepc-client = { version = "0.15.0", features = ["client-sync"] }
futures = "0.3.32"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
toml = "1.1.2"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
