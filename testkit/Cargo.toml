[package]
name = "testkit"
version.workspace = true
edition.workspace = true

[dependencies]
observer = { path = "../observer" }
shared = { path = "../shared" }
api = { path = "../api" }
corepc-client.workspace = true
# Spawns a regtest bitcoind for integration tests
bitcoind = { version = "0.42.0", default-features = false, features = [
  "31_1",
  "download",
] }
# Postgres for diesel-async integration tests.
diesel.workspace = true
diesel-async.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
serde_json.workspace = true
time.workspace = true
tokio.workspace = true

[features]
# Treat warnings as a build error.
strict = []
