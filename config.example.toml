bind = "127.0.0.1:3333" # host:port the HTTP server binds to

poll_interval_secs = 10

log_level = "debug" # trace | debug | info | warn | error

[rpc]
host = "127.0.0.1:8332"
user = "user"
pass = "pass"

[zmq]
blocks_endpoint = "tcp://127.0.0.1:28332" # requires `zmqpubhashblock=tcp://0.0.0.0:28332` in bitcoin.conf

[database]
url = "postgres://user:pass@localhost:5432/mempool"
