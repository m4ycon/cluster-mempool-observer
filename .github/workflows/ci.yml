name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  backend-lint:
    name: backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  backend-build-test:
    name: backend build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Install nats-server and libpq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y nats-server libpq-dev
          nats-server --version
      - name: Build
        run: cargo build --workspace --all-features --tests
      - name: Run tests
        run: cargo nextest run --workspace --all-features

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint + format check
        run: pnpm biome ci
      - name: Build
        run: pnpm build
      - name: Test
        run: pnpm test

  ts-bindings:
    name: ts-bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
      - name: Regenerate ts-rs bindings
        run: cargo test -p shared export_bindings
      - name: Fail if generated bindings are out of date
        run: git diff --exit-code
